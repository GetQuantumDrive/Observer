targets:
  # Identity & Access Management — heavy asymmetric crypto, signing, TLS
  - name: "Keycloak"
    repo: "keycloak/keycloak"
    category: "iam"
    description: "Red Hat open-source identity and access management"

  - name: "WSO2 Identity Server"
    repo: "wso2/product-is"
    category: "iam"
    description: "Enterprise identity and access management server"

  - name: "Spring Security"
    repo: "spring-projects/spring-security"
    category: "framework"
    description: "Authentication and authorization for Spring applications"

  - name: "Apache Shiro"
    repo: "apache/shiro"
    category: "framework"
    description: "Powerful and easy-to-use Java security framework"

  - name: "pac4j"
    repo: "pac4j/pac4j"
    category: "framework"
    description: "Security engine for Java: authentication and authorization"

  # Transport / networking — TLS handshake, cipher selection
  - name: "Netty"
    repo: "netty/netty"
    category: "transport"
    description: "Asynchronous event-driven network application framework"

  - name: "Jetty"
    repo: "eclipse/jetty.project"
    category: "transport"
    description: "Lightweight HTTP server and servlet container"

  - name: "Apache Tomcat"
    repo: "apache/tomcat"
    category: "transport"
    description: "Dominant servlet container with JSSE/TLS configuration"

  - name: "gRPC Java"
    repo: "grpc/grpc-java"
    category: "transport"
    description: "Java implementation of gRPC with mutual TLS support"

  - name: "OkHttp"
    repo: "square/okhttp"
    category: "transport"
    description: "Square's efficient HTTP client with TLS pinning"

  # Application servers & frameworks — TLS, security subsystems, secret management
  - name: "WildFly"
    repo: "wildfly/wildfly"
    category: "framework"
    description: "JBoss application server with extensive security subsystem"

  - name: "Spring Boot"
    repo: "spring-projects/spring-boot"
    category: "framework"
    description: "Convention-over-configuration framework; TLS auto-config, secret management"

  - name: "Quarkus"
    repo: "quarkusio/quarkus"
    category: "framework"
    description: "Cloud-native Java framework with security extensions"

  # Messaging / streaming — TLS, SASL, at-rest encryption
  - name: "Apache Kafka"
    repo: "apache/kafka"
    category: "messaging"
    description: "Distributed event streaming (TLS, SASL/SCRAM, ACLs)"

  - name: "Apache Camel"
    repo: "apache/camel"
    category: "messaging"
    description: "Integration framework with a dedicated crypto component"

  - name: "Apache ActiveMQ"
    repo: "apache/activemq"
    category: "messaging"
    description: "Message broker with TLS and JAAS authentication"

  # Web services — WS-Security, XML-DSig, XML-Enc
  - name: "Apache CXF"
    repo: "apache/cxf"
    category: "framework"
    description: "Web services framework with full WS-Security stack"

  # Storage / databases — TLS, encryption at rest, Kerberos
  - name: "Elasticsearch"
    repo: "elastic/elasticsearch"
    category: "storage"
    description: "Distributed search engine with TLS and encrypted snapshots"

  - name: "Apache Cassandra"
    repo: "apache/cassandra"
    category: "storage"
    description: "Distributed NoSQL database with TLS and encryption at rest"

  - name: "Apache Hadoop"
    repo: "apache/hadoop"
    category: "storage"
    description: "Big-data platform using Kerberos and TLS extensively"

  - name: "Apache ZooKeeper"
    repo: "apache/zookeeper"
    category: "storage"
    description: "Distributed coordination service with TLS and SASL/Kerberos"

  - name: "Neo4j"
    repo: "neo4j/neo4j"
    category: "storage"
    description: "Graph database with TLS and role-based auth"

  - name: "MongoDB Java Driver"
    repo: "mongodb/mongo-java-driver"
    category: "storage"
    description: "Official MongoDB driver; TLS, x.509, SCRAM authentication"

  # CI/CD — credentials store, TLS, plugin signing
  - name: "Jenkins"
    repo: "jenkinsci/jenkins"
    category: "cicd"
    description: "CI/CD platform with credentials management and TLS"

  # Healthcare / regulated — HIPAA, secure data exchange
  - name: "OpenMRS"
    repo: "OpenMRS/openmrs-core"
    category: "healthcare"
    description: "Open-source medical records platform (HIPAA compliance)"
