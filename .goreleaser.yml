version: 2

before:
  hooks:
    - git submodule update --init --recursive
    - go mod tidy

builds:
  - id: observer-cli
    main: ./cmd/observer
    binary: observer
    goos:   [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.cliVersion={{.Version}}

archives:
  - id: observer-cli
    builds: [observer-cli]
    name_template: "observer-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

brews:
  - name: observer
    ids: [observer-cli]
    repository:
      owner: getquantumdrive
      name: homebrew-pqc
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/getquantumdrive/observer"
    description: "Post-quantum cryptography scanner — detects quantum-vulnerable algorithms in source code"
    license: "Apache-2.0"
    install: |
      bin.install "observer"
    test: |
      system "#{bin}/observer", "--version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
