name: 'Observer - PQC Compliance Scanner'
description: >
  Detect quantum-vulnerable cryptography (RSA, ECDSA, ECDH, DH, DSA) in your codebase
  and enforce NIS2 / DORA / NIST FIPS 203 / FIPS 204 compliance in CI.
author: 'GetQuantumDrive'
branding:
  icon: shield
  color: purple

inputs:
  rules-repos:
    description: >
      Newline-separated list of GitHub rules repos (owner/repo[@ref][:path]).
      Entries can embed a per-repo token with '|<token>' suffix for cross-org auth.
      Layered in list order on top of bundled default rules; later entries override earlier ones on duplicate rule IDs.
    required: false
    default: ''
  rules-repos-token:
    description: 'Default bearer token applied to rules-repos entries that do not carry an inline token'
    required: false
    default: ''
  use-bundled-rules:
    description: 'Use the default Observer rules bundled into the Docker image. Set to false to disable.'
    required: false
    default: 'true'
  rules-dir:
    description: 'Local directory containing custom YAML rules checked into this repo'
    required: false
    default: '.pqc/rules'
  extra-rules-dir:
    description: 'Additional local rules directory (highest priority, overrides repo rules with same ID)'
    required: false
    default: ''
  fail-on:
    description: 'Fail the build when findings of this severity (or worse) are found. One of: critical, high, any, never'
    required: false
    default: 'critical'
  report-url:
    description: 'Groundstate server URL to POST the scan report to (e.g. https://app.groundstate.io)'
    required: false
    default: ''
  report-token:
    description: 'Bearer token for authenticating with the Groundstate server'
    required: false
    default: ''
  output:
    description: 'Write the scan report to this path (e.g. observer-report.json, observer.sarif, or observer-report.html)'
    required: false
    default: ''
  output-format:
    description: 'Report format written to the output path. One of: json (Observer canonical) | sarif (for GitHub Code Scanning / SonarQube) | html (self-contained HTML report)'
    required: false
    default: 'json'

outputs:
  findings:
    description: 'Total number of findings'
  critical:
    description: 'Number of CRITICAL findings'
  high:
    description: 'Number of HIGH findings'
  compliance:
    description: 'NIS2 compliance status: COMPLIANT | AT RISK | NON-COMPLIANT'
  report-json:
    description: 'Full scan report as a JSON string'

runs:
  using: 'docker'
  image: 'Dockerfile'
