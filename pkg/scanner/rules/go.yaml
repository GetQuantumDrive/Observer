- id: go-rsa-generate
  language: go
  pattern: |-
    rsa\.GenerateKey|rsa\.GenerateMultiPrimeKey
  algorithm: RSA
  quantum_threat: shor-broken
  primitive: asymmetric-encryption
  message: "RSA key generation detected; vulnerable to Shor's algorithm."
  migration: "Replace with golang.org/x/crypto post-quantum primitives or Cloudflare CIRCL (ML-KEM / ML-DSA)."

- id: go-ecdh
  language: go
  pattern: |-
    ecdh\.P256\(\)|ecdh\.P384\(\)|ecdh\.P521\(\)|ecdh\.X25519\(\)
  algorithm: ECDH
  quantum_threat: shor-broken
  primitive: key-exchange
  message: "ECDH key exchange detected; vulnerable to Shor's algorithm."
  migration: "Replace with ML-KEM (FIPS 203) via Cloudflare CIRCL library."

- id: go-ecdsa
  language: go
  pattern: |-
    ecdsa\.GenerateKey|ecdsa\.Sign|ecdsa\.Verify
  algorithm: ECDSA
  quantum_threat: shor-broken
  primitive: signature
  message: "ECDSA operation detected; vulnerable to Shor's algorithm."
  migration: "Replace with ML-DSA (FIPS 204) via Cloudflare CIRCL library."

- id: go-dsa
  language: go
  pattern: |-
    dsa\.GenerateKey|dsa\.Sign
  algorithm: DSA
  quantum_threat: shor-broken
  primitive: signature
  severity: CRITICAL
  message: "DSA operation detected; DSA is deprecated, quantum-vulnerable, and retired by NIST in 2023."
  migration: "Replace with ML-DSA (CRYSTALS-Dilithium, FIPS 204)."

- id: go-tls-rsa-cipher
  language: go
  pattern: |-
    tls\.TLS_RSA_WITH|tls\.TLS_ECDHE_RSA
  algorithm: RSA/ECDHE-RSA
  quantum_threat: shor-broken
  primitive: key-exchange
  severity: MEDIUM
  message: "TLS cipher suite with RSA key exchange detected; quantum-vulnerable under Harvest Now, Decrypt Later."
  migration: "Migrate to TLS 1.3 with post-quantum key exchange (X25519Kyber768) once widely supported."
