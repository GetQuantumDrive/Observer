- id: java-rsa-keygen
  language: java
  pattern: |-
    KeyPairGenerator\.getInstance\s*\(\s*["']RSA["']
  algorithm: RSA
  quantum_threat: shor-broken
  primitive: asymmetric-encryption
  message: "RSA key generation detected; vulnerable to Shor's algorithm."
  migration: "Replace with ML-KEM (CRYSTALS-Kyber, FIPS 203) for key encapsulation or ML-DSA (CRYSTALS-Dilithium, FIPS 204) for signatures."

