  severity: CRITICAL
  message: "SHA-1 signature detected; SHA-1 is classically broken and the underlying asymmetric primitive is quantum-vulnerable."
  migration: "Replace immediately with ML-DSA (CRYSTALS-Dilithium, FIPS 204)."

