name: CI - Gradle Plugin

on:
  push:
    paths:
      - 'plugins/gradle/**'
      - 'VERSION'
  pull_request:
    paths:
      - 'plugins/gradle/**'
      - 'VERSION'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build observer CLI binary for integration tests
        run: |
          go build -o /tmp/observer-bin ./cmd/observer
          echo "OBSERVER_BINARY_OVERRIDE=/tmp/observer-bin" >> $GITHUB_ENV

      - name: Run unit tests
        working-directory: plugins/gradle
        run: ./gradlew test

      - name: Run integration tests
        working-directory: plugins/gradle
        run: ./gradlew integrationTest
